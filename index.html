<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Открываю R34 Downloader…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Inter, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #0e0e0e;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 420px;
            padding: 20px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #333;
            border-top-color: #26A5E4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="opening">
            <h2>Открываю приложение…</h2>
            <div class="spinner"></div>
        </div>
        <div id="fallback" class="hidden">
            <h2>Приложение не установлено</h2>
            <p>Чтобы открыть эту ссылку, приложение R34 Downloader должно быть установлено на устройстве.</p>
            <p>Если оно у тебя есть — открой APK вручную.</p>
            <a id="open" href="r34downloader://open">Открыть повторно</a>
        </div>
    </div>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Пробуем deeplink сразу
        const deeplink = "r34downloader://open?" + params.toString();
        const a = document.createElement('a');
        a.href = deeplink;
        a.click();
    
        // Fallback через 2 сек
        setTimeout(() => {
            document.getElementById("open").href = deeplink;
            document.getElementById("opening").classList.add("hidden");
            document.getElementById("fallback").classList.remove("hidden");
        }, 2000);
    </script>
</body>
</html>
