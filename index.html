<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Открываю R34 Downloader…</title>
    <link rel="stylesheet" href="assets/css/page.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="container">
        <div id="opening">
            <h2>Открываю приложение…</h2>
            <div class="spinner"></div>
        </div>

        <div id="fallback" class="hidden">
            <h2>Приложение не установлено</h2>
            <p>Чтобы открыть эту ссылку, приложение R34 Downloader должно быть установлено на устройстве.</p>

            <p class="hint">Откройте приложение вручную и вставьте следующие теги:</p>

            <div class="md-field">
                <input
                    id="tagsField"
                    type="text"
                    class="md-input"
                    readonly
                >
                <button id="copyTags" type="button" class="md-icon-button" aria-label="Скопировать теги">
                    <span class="material-symbols-rounded">content_copy</span>
                </button>
            </div>

            <a id="open" href="r34downloader://open">Открыть повторно</a>
        </div>

        <div id="toast" class="toast">Теги скопированы</div>
    </div>
    
    <script src="assets/js/page.js"></script>
</body>
</html>
